#
# Perfil `docker` (modulo 5): la aplicacion dentro de docker compose,
# integrada con el resto de la infraestructura del curso.
#
# Se activa desde docker/compose.yaml con SPRING_PROFILES_ACTIVE=docker,mysql
# (los perfiles se acumulan: este aporta la integracion, `mysql` la base de datos).
#
# Aqui se ve el mensaje clave del modulo: el MISMO artefacto se despliega en
# todos los entornos y lo unico que cambia es la configuracion externa.
#

# --- Service discovery -----------------------------------------------------
eureka.client.enabled=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# --- Spring Boot Admin -----------------------------------------------------
spring.boot.admin.client.enabled=true
spring.boot.admin.client.instance.prefer-ip=true

# --- Servicios companeros --------------------------------------------------
petclinic.bills.base-url=http://bills-service:8040

# --- Registro --------------------------------------------------------------
# Dentro de un contenedor el SQL formateado ensucia mucho la salida agregada.
spring.jpa.show-sql=false
