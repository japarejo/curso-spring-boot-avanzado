#
# Perfil `nplus1` (modulo 6): laboratorio de consultas N+1.
#
# Arranque:
#   ./mvnw -pl apps/petclinic-api spring-boot:run -Dspring-boot.run.profiles=nplus1
#
# Que hace:
#   - Vuelve a activar open-in-view, que es el valor por defecto de Spring Boot
#     y lo que tenia el proyecto original. Mantiene la sesion de Hibernate
#     abierta hasta que se termina de renderizar la vista.
#   - Enciende el registro de SQL y de parametros.
#   - Activa las estadisticas de Hibernate, que al cerrar la sesion imprimen
#     el numero de consultas ejecutadas.
#
# El mensaje de la unidad: open-in-view no arregla nada, solo cambia el sintoma.
# Con el activado, recorrer una coleccion perezosa desde la vista funciona pero
# dispara una consulta por elemento. Con el desactivado, el mismo codigo falla
# con LazyInitializationException. El defecto es el mismo en los dos casos;
# la solucion tambien: traer los datos que la vista necesita en la consulta
# (@EntityGraph o LEFT JOIN FETCH).
#
spring.jpa.open-in-view=true

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.generate_statistics=true

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.org.hibernate.stat=DEBUG
