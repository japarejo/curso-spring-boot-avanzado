#
# Configuracion por defecto de petclinic-api.
#
# Arrancar sin indicar perfil funciona: H2 en memoria, esquema generado por
# Hibernate y datos de data.sql. Es lo que se usa en clase y en las pruebas.
#
# Los perfiles solo SOBRESCRIBEN lo que cambia (modulo 5):
#   mysql   -> MySQL externo, esquema ya creado, sin carga de datos
#   docker  -> ademas activa Eureka, Config Server y Spring Boot Admin
#
spring.application.name=petclinic-api

server.port=${SERVER_PORT:8080}

# --- Persistencia ----------------------------------------------------------
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Hace que data.sql se ejecute DESPUES de que Hibernate cree el esquema.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.platform=h2
spring.h2.console.enabled=true
# Desactivar open-in-view es deliberado (modulo 6): obliga a que las relaciones
# perezosas se resuelvan dentro de la transaccion y no al renderizar la vista.
# Si aparece LazyInitializationException, el problema estaba ahi antes, oculto.
spring.jpa.open-in-view=false
# Flyway se activa solo en los perfiles con MySQL (ver application-mysql.properties).
# Con H2 el arranque es instantaneo y la base se recrea en cada ejecucion.
spring.flyway.enabled=false

# --- Internacionalizacion --------------------------------------------------
spring.messages.basename=messages/messages

# --- Vistas JSP ------------------------------------------------------------
# Unica fuente de verdad para el prefijo y el sufijo de las vistas.
# No declarar ademas un InternalResourceViewResolver en WebConfig.
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# --- Swagger UI como herramienta de clase (modulos 1 a 6) -------------------
# Se usa Swagger UI en lugar de curl para probar la API: http://localhost:8080/swagger-ui.html
# - try-it-out-enabled: los formularios aparecen ya editables, sin pulsar "Try it out".
# - display-request-duration: muestra cuanto tarda cada peticion (modulo 6, N+1).
# - persist-authorization: el token o usuario de "Authorize" sobrevive a recargar la pagina.
# - show-actuator: los endpoints de Actuator (health, loggers, metrics...) tambien se
#   pueden llamar desde Swagger UI, incluido el POST que cambia el nivel de registro.
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
springdoc.show-actuator=true
springdoc.swagger-ui.path=/mi-documentacion

# Solo la API y Actuator. Sin esto aparecen tambien los controladores de las vistas
# JSP (owner-controller, pet-controller...), que devuelven HTML y solo estorban.
springdoc.paths-to-match=/api/**,/actuator/**,/data-api/**

# --- Gestion de errores ----------------------------------------------------
server.error.whitelabel.enabled=false

# --- Actuator --------------------------------------------------------------
# Exponerlo todo es comodo en clase y una mala idea en produccion:
# /actuator/env y /actuator/heapdump revelan informacion sensible (modulo 5).
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.endpoint.env.show-values=always
management.endpoint.configprops.show-values=always
management.info.env.enabled=true

# --- Registro --------------------------------------------------------------
logging.level.org.springframework=INFO
logging.level.org.springframework.samples.petclinic=DEBUG
# Descomentar para el ejercicio de deteccion de consultas N+1 (modulo 6):
#logging.level.org.hibernate.SQL=DEBUG
#logging.level.org.hibernate.orm.jdbc.bind=TRACE

# --- Service discovery (modulo 5) ------------------------------------------
# Desactivado por defecto: sin esto, arrancar la aplicacion sola llena la
# consola de errores contra un Eureka que no existe. El perfil docker lo activa.
eureka.client.enabled=false
eureka.client.serviceUrl.defaultZone=${EUREKA_URI:http://localhost:8761/eureka}

# --- Spring Boot Admin (modulo 5) ------------------------------------------
spring.boot.admin.client.enabled=false
spring.boot.admin.client.url=${ADMIN_SERVER_URI:http://localhost:9090}

# --- Cliente del servicio de facturas (modulo 2) ---------------------------
# Antes esta URL estaba escrita a fuego en tres sitios distintos del codigo,
# con tres valores diferentes (8040, 8095 y una propiedad vacia).
petclinic.bills.base-url=${BILLS_API_URL:http://localhost:8040}
petclinic.bills.connect-timeout=2s
petclinic.bills.read-timeout=5s

# --- Resiliencia: reintentos con resilience4j (modulo 5) --------------------
# El nombre de cada instancia es el que aparece en @Retry(name = "...").
# Ejemplos ejecutables en Swagger UI, grupo "Resilience demo":
#   GET /api/v1/resilience-demo/retry                 politica efectiva de cada instancia
#   GET /api/v1/resilience-demo/retry/{escenario}     ejecuta y muestra cada intento
# Eventos y estado: /actuator/retries y /actuator/retryevents
#
# Propiedades de una instancia (o de una config base):
#   max-attempts                   intentos TOTALES, incluido el primero (3 = 1 + 2 reintentos)
#   wait-duration                  espera entre intentos (espera inicial si hay backoff)
#   enable-exponential-backoff     cada espera = la anterior * exponential-backoff-multiplier
#   exponential-backoff-multiplier multiplicador del backoff (por defecto 1.5)
#   exponential-max-wait-duration  tope de la espera exponencial
#   enable-randomized-wait         anade aleatoriedad (jitter): espera +/- randomized-wait-factor
#   randomized-wait-factor         0.5 -> la espera cae en [50%, 150%] de la calculada
#   retry-exceptions               SOLO se reintenta ante estas (y sus subclases)
#   ignore-exceptions              nunca se reintentan; tiene prioridad sobre retry-exceptions
#   retry-exception-predicate      clase Predicate<Throwable> para decidir con codigo
#   result-predicate               clase Predicate<Object>: true -> el resultado no vale, reintenta
#   fail-after-max-attempts        con result-predicate: si se agotan los intentos lanza
#                                  MaxRetriesExceededException en vez de devolver el ultimo resultado
#   base-config                    hereda de resilience4j.retry.configs.<nombre>

# Configuracion base reutilizable: 4 intentos, 300 ms entre ellos.
# OJO 1: si se llamara "default", la heredarian TODAS las instancias sin base-config.
# OJO 2 (resilience4j 2.x): una instancia con enable-exponential-backoff o
# enable-randomized-wait no puede heredar de una base con wait-duration; falla
# al arrancar con "The intervalFunction was configured twice". Por eso las
# instancias con backoff (2, 3 y 6) definen su politica completa.
resilience4j.retry.configs.comun.max-attempts=4
resilience4j.retry.configs.comun.wait-duration=300ms

# 1) Espera fija: hereda max-attempts=4 de "comun" y sobrescribe la espera
#    -> 1000, 1000, 1000 ms
resilience4j.retry.instances.demoEsperaFija.base-config=comun
resilience4j.retry.instances.demoEsperaFija.wait-duration=1s

# 2) Backoff exponencial con tope: 200, 400, 800 y 1000 ms (el tope corta los 1600)
resilience4j.retry.instances.demoExponencial.max-attempts=5
resilience4j.retry.instances.demoExponencial.wait-duration=200ms
resilience4j.retry.instances.demoExponencial.enable-exponential-backoff=true
resilience4j.retry.instances.demoExponencial.exponential-backoff-multiplier=2
resilience4j.retry.instances.demoExponencial.exponential-max-wait-duration=1s

# 3) Backoff exponencial + jitter. Si muchos clientes fallan a la vez, sin
#    aleatoriedad reintentan todos en el mismo instante y vuelven a tumbar el
#    servicio. Con factor 0.5: ~[100-300], [200-600], [400-1200], [800-2400] ms
resilience4j.retry.instances.demoExponencialAleatoria.max-attempts=5
resilience4j.retry.instances.demoExponencialAleatoria.wait-duration=200ms
resilience4j.retry.instances.demoExponencialAleatoria.enable-exponential-backoff=true
resilience4j.retry.instances.demoExponencialAleatoria.exponential-backoff-multiplier=2
resilience4j.retry.instances.demoExponencialAleatoria.enable-randomized-wait=true
resilience4j.retry.instances.demoExponencialAleatoria.randomized-wait-factor=0.5

# 4) Que se reintenta y que no. Pruebese con ?tipo=transitorio y ?tipo=permanente
resilience4j.retry.instances.demoExcepciones.base-config=comun
resilience4j.retry.instances.demoExcepciones.retry-exceptions=org.springframework.samples.petclinic.resilience.FalloTransitorioException
resilience4j.retry.instances.demoExcepciones.ignore-exceptions=org.springframework.samples.petclinic.resilience.FalloPermanenteException

# 5) Reintento por resultado: se vuelve a preguntar mientras la respuesta sea PENDIENTE
resilience4j.retry.instances.demoResultado.base-config=comun
resilience4j.retry.instances.demoResultado.result-predicate=org.springframework.samples.petclinic.resilience.RespuestaPendientePredicate
resilience4j.retry.instances.demoResultado.fail-after-max-attempts=true

# 6) Llamada HTTP real a bills-service (BillsGateway.conRestClientYReintentos).
#    Se reintentan los errores de red y los 5xx; nunca los 4xx ni el circuito abierto.
resilience4j.retry.instances.bills.max-attempts=3
resilience4j.retry.instances.bills.wait-duration=500ms
resilience4j.retry.instances.bills.enable-exponential-backoff=true
resilience4j.retry.instances.bills.exponential-backoff-multiplier=2
resilience4j.retry.instances.bills.retry-exceptions=org.springframework.web.client.ResourceAccessException,org.springframework.web.client.HttpServerErrorException
resilience4j.retry.instances.bills.ignore-exceptions=org.springframework.web.client.HttpClientErrorException,io.github.resilience4j.circuitbreaker.CallNotPermittedException


# MODULO 2: Spring Data REST
spring.data.rest.base-path=/data-api
# ANNOTATED: solo se publican los repositorios anotados. Con DEFAULT se publicarian
# TODOS, incluido UserRepository con los hashes de las contrasenas.
spring.data.rest.detection-strategy=annotated
api.version=1
