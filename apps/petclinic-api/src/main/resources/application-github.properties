#
# Perfil "github": login con GitHub (modulo 3, ejercicios 15 y 16).
#
#   1. Registra una OAuth App en GitHub (Settings > Developer settings > OAuth Apps):
#        Homepage URL                http://localhost:8000
#        Authorization callback URL  http://localhost:8000/login/oauth2/code/github
#   2. Exporta las credenciales y arranca con el perfil:
#        export GITHUB_CLIENT_ID=...  GITHUB_CLIENT_SECRET=...
#        ./mvnw -pl apps/petclinic-api spring-boot:run -Dspring-boot.run.profiles=github
#      En PowerShell: $env:GITHUB_CLIENT_ID="..."; $env:GITHUB_CLIENT_SECRET="..."
#
# Credenciales SIEMPRE de variables de entorno. Sin valor por defecto a proposito:
# si falta alguna, la aplicacion no arranca y dice cual.
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:whatever}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:you-know}

# Alta automatica: quien entra con GitHub por primera vez obtiene la cuenta
# gh-<login> con la autoridad indicada, y queda autenticado.
petclinic.github.alta-automatica=true
petclinic.github.autoridad-inicial=owner

# Opcional: vincular tu cuenta de GitHub a un usuario que YA existe en lugar de
# crear uno nuevo. Tu id: https://api.github.com/users/<tu-login> (campo "id").
# Solo cuenta la primera vez; despues manda la tabla github_accounts.
#petclinic.github.vinculos.583231=owner1
