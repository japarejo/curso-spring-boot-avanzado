#
# Perfil `mysql` (modulos 5 y 6): la misma aplicacion contra un MySQL externo.
#
# Arranque:
#   docker compose -f docker/compose.yaml up -d mysql
#   ./mvnw -pl apps/petclinic-api spring-boot:run -Dspring-boot.run.profiles=mysql
#
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/petclinic}
spring.datasource.username=${MYSQL_USER:petclinic}
spring.datasource.password=${MYSQL_PASSWORD:petclinic}

# --- MODULO 6: evolucion del esquema con Flyway ----------------------------
# Aqui el esquema NO lo genera Hibernate. Lo aplican las migraciones de
# src/main/resources/db/migration, numeradas y aplicadas una sola vez.
#
# `validate` hace que Hibernate compruebe que el esquema encaja con las
# entidades y aborte el arranque si no. Es la pareja natural de Flyway:
# las migraciones mandan, Hibernate vigila.
#
# Nunca `update` en un entorno que sobreviva a un reinicio: no borra, no
# renombra, aplica cambios sin control de version y deja el esquema fuera
# del repositorio.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate

# data.sql no se ejecuta: los datos vienen en V2__datos_iniciales.sql
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false

spring.h2.console.enabled=false
