#
# Perfil `mysql` (modulo 5): la misma aplicacion contra un MySQL externo.
#
# Arranque:
#   ./mvnw -pl apps/petclinic-api spring-boot:run -Dspring-boot.run.profiles=mysql
#
# Diferencias con el perfil por defecto:
#   - el esquema NO lo genera Hibernate, se aplica con migraciones o con el
#     script de inicializacion del contenedor;
#   - no se ejecuta data.sql;
#   - Hibernate solo valida que el esquema encaja con las entidades.
#
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/petclinic}
spring.datasource.username=${MYSQL_USER:petclinic}
spring.datasource.password=${MYSQL_PASSWORD:petclinic}

spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false

spring.h2.console.enabled=false
