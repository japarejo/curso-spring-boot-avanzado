#
# MODULO 5 - Cliente de la infraestructura: registro, configuracion y panel.
#
spring.application.name=bills-service
server.port=8040
api.version=v1

# --- Configuracion remota (Spring Cloud Config) ----------------------------
# `optional:` hace que la aplicacion arranque aunque el Config Server no este
# levantado, en lugar de morir en el arranque. Util en clase: se ensena primero
# el valor local y luego el remoto, sin reiniciar la infraestructura entera.
spring.config.import=optional:configserver:
spring.cloud.config.uri=${CONFIG_SERVER_URI:http://localhost:8889}
spring.cloud.config.fail-fast=${CONFIG_FAIL_FAST:false}

# Ejercicio 14 - Consumo seguro del Config Server. Inactivo por defecto: sin
# estas variables de entorno, el cliente no manda credenciales y usa http.
#   Parte A (Basic): CONFIG_CLIENT_USER, CONFIG_CLIENT_PASSWORD y CONFIG_FAIL_FAST=true
#   Parte B (TLS):   ademas CONFIG_SERVER_URI=https://localhost:8889,
#                    CONFIG_TLS_ENABLED=true, CONFIG_TLS_TRUST_STORE y CONFIG_TLS_PASSWORD
# Van AQUI y no en un application-<perfil>.properties: la importacion de
# configserver: se resuelve antes de activar los perfiles, y unas credenciales
# en un fichero de perfil se ignoran sin avisar.
spring.cloud.config.username=${CONFIG_CLIENT_USER:}
spring.cloud.config.password=${CONFIG_CLIENT_PASSWORD:}
spring.cloud.config.tls.enabled=${CONFIG_TLS_ENABLED:false}
spring.cloud.config.tls.trust-store=${CONFIG_TLS_TRUST_STORE:}
spring.cloud.config.tls.trust-store-password=${CONFIG_TLS_PASSWORD:}
spring.cloud.config.tls.trust-store-type=PKCS12
spring.profiles.active=development

# Valor por defecto LOCAL. El Config Server lo sobrescribe: comparar
#   curl localhost:8040/api/v1/bills/whoami/ana     (con y sin config-server)
# es la demostracion central del modulo.
user.role=valor local (el config-server no ha respondido)
billing.demo.discount-percent=0

# --- Registro en Eureka ----------------------------------------------------
eureka.client.serviceUrl.defaultZone=${EUREKA_URI:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.instance.health-check-url-path=/actuator/health
eureka.instance.metadata-map.startup=${random.int}

# --- Documentacion OpenAPI -------------------------------------------------
springdoc.api-docs.path=/doc
springdoc.swagger-ui.path=/
# Swagger UI en la raiz (http://localhost:PUERTO/) y lista para probar en clase
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.filter=true
# Actuator tambien en Swagger UI: /actuator/refresh se lanza desde ahi (modulo 5)
springdoc.show-actuator=true

# --- Persistencia ----------------------------------------------------------
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true

# --- Actuator --------------------------------------------------------------
# Esta lista es amplia para poder ensenar el panel de Boot Admin. En produccion
# se recorta: env y configprops con show-values=always exponen configuracion
# sensible a cualquiera que alcance el puerto.
management.endpoints.web.exposure.include=health,info,metrics,env,loggers,configprops,refresh
management.endpoint.health.show-details=always
management.endpoint.env.show-values=always
management.endpoint.configprops.show-values=always
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.description=Servicio de facturas: cliente de Eureka, Config Server y Boot Admin
