#
# MODULO 3 - Servicio de autenticacion.
#
spring.application.name=auth-service
server.port=8060

# --- JWT -------------------------------------------------------------------
# Perfil por defecto: firma simetrica HS512.
# Para la variante asimetrica: -Dspring-boot.run.profiles=rsa
#
# AVISO: este secreto es de DEMOSTRACION y esta versionado a proposito para que
# el curso funcione recien clonado el repositorio. En un sistema real va en una
# variable de entorno o en un gestor de secretos, y NUNCA en el control de
# versiones (modulo 3, "errores frecuentes": secretos en el repositorio).
#
# HS512 exige 512 bits como minimo. jjwt lo comprueba al arrancar y falla si el
# secreto es mas corto, en lugar de firmar con algo debil.
jwt.secret=${JWT_SECRET:mmneWq36D763GkpMMOIBmxQ7JU5KXMu88JaZGSIRoGR0cZQux9JugEW4QQWj4UhJfjKsBNtE73LvJL3Z7yA+bQ==}
jwt.issuer=auth-service
# Caducidad corta a proposito: un token de vida larga sin revocacion es uno de
# los riesgos del OWASP API Security Top 10.
jwt.validity-seconds=3600

# --- Persistencia ----------------------------------------------------------
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# --- Documentacion OpenAPI -------------------------------------------------
springdoc.api-docs.path=/doc
springdoc.swagger-ui.path=/

# --- Registro en Eureka ----------------------------------------------------
eureka.client.enabled=${EUREKA_ENABLED:false}
eureka.client.serviceUrl.defaultZone=${EUREKA_URI:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

# --- Actuator --------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
info.app.name=${spring.application.name}
info.app.description=Servicio de autenticacion JWT del curso Spring Boot avanzado
