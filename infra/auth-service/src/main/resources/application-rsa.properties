#
# MODULO 3 - Perfil `rsa`: firma asimetrica RS256.
#
# Arranque:
#   ./mvnw -pl infra/auth-service spring-boot:run -Dspring-boot.run.profiles=rsa
#
# Diferencia con el perfil por defecto: la clave PRIVADA firma y la PUBLICA
# verifica. Los servicios que solo necesitan validar tokens reciben unicamente
# la clave publica, asi que no pueden emitirlos. Es el modelo de OAuth 2 y
# OpenID Connect.
#
# Ejercicio de clase: autenticarse con este perfil, copiar el token en jwt.io y
# comprobar que la cabecera dice "alg": "RS256" en lugar de "HS512".
#
# =========================================================================
#  CLAVES DE DEMOSTRACION. Generadas para este curso y versionadas a
#  proposito para que funcione sin preparar nada. NO USAR EN PRODUCCION.
#  Una clave privada real nunca se guarda en el control de versiones.
# =========================================================================
jwt.private-key=${JWT_PRIVATE_KEY:}
jwt.public-key=${JWT_PUBLIC_KEY:}
