#
# MODULO 5 - Ejercicio 14, parte B (opcional): el servidor de configuracion
# solo atiende por HTTPS.
#
# Basic sin TLS manda la clave en Base64, que se lee como texto en claro en
# cualquier punto de la red. Este perfil cierra ese hueco.
#
# Antes hay que generar el certificado (ver soluciones/Ejercicio14ConfigSegura.md).
# Arranque, con las mismas variables de entorno que el perfil secure:
#   ./mvnw -pl infra/config-server spring-boot:run -Dspring-boot.run.profiles=native,secure,tls
#
# CONFIG_TLS_DIR debe ser una ruta ABSOLUTA: spring-boot:run arranca la
# aplicacion desde la carpeta del modulo, no desde la raiz del repositorio.
#
server.ssl.bundle=config-server
spring.ssl.bundle.jks.config-server.keystore.location=file:${CONFIG_TLS_DIR}/config-server.p12
spring.ssl.bundle.jks.config-server.keystore.password=${CONFIG_TLS_PASSWORD}
spring.ssl.bundle.jks.config-server.keystore.type=PKCS12
spring.ssl.bundle.jks.config-server.key.alias=config-server

# Eureka anuncia el servidor con https y el puerto seguro
eureka.instance.secure-port-enabled=true
eureka.instance.non-secure-port-enabled=false
eureka.instance.secure-port=${server.port}
