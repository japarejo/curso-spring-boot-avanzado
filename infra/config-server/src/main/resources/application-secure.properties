#
# MODULO 5 - Ejercicio 14, parte A: el servidor de configuracion exige Basic.
#
# Se SUMA al perfil del backend (native o git), no lo sustituye:
#   ./mvnw -pl infra/config-server spring-boot:run -Dspring-boot.run.profiles=native,secure
#
# Las claves no tienen valor por defecto a proposito: si falta alguna variable
# de entorno, el servidor no arranca y el error dice cual. Las reglas de acceso
# estan en SecurityConfiguration.java.
#
config.security.client.username=${CONFIG_CLIENT_USER:config-client}
config.security.client.password=${CONFIG_CLIENT_PASSWORD}
config.security.admin.username=${CONFIG_ADMIN_USER:config-admin}
config.security.admin.password=${CONFIG_ADMIN_PASSWORD}

# Con el servidor protegido, la salud sigue siendo publica pero sin detalles:
# un anonimo sabe si esta UP, no que backend usa ni donde esta el repositorio.
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=CONFIG_ADMIN
