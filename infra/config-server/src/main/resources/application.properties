#
# MODULO 5 - Servidor de configuracion.
#
spring.application.name=config-server
server.port=8889

# --- Origen de la configuracion -------------------------------------------
# Backend `native`: sirve los ficheros de src/main/resources/config-repo.
# Es el modo por defecto porque funciona recien clonado el repositorio, sin
# preparar nada. Para la variante con Git, ver application-git.properties.
#
# IMPORTANTE: sin esta linea, Spring Cloud Config busca en las ubicaciones por
# defecto y NO encuentra config-repo. En el proyecto anterior estaba comentada,
# y lo unico que se servia era un fichero suelto en la raiz del classpath
# guardado en UTF-16 con BOM, que llegaba ilegible. De ahi el sintoma que
# documentaba el guion: "bills responde admin en lugar del valor esperado".
spring.profiles.active=native
spring.cloud.config.server.native.search-locations=classpath:/config-repo

# --- Registro en Eureka ----------------------------------------------------
eureka.client.serviceUrl.defaultZone=${EUREKA_URI:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true

# --- Actuator --------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics,env,refresh
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.description=Servidor de configuracion del curso Spring Boot avanzado
