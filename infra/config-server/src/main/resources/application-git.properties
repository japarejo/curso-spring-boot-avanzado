#
# MODULO 5 - Variante con backend Git (para la discusion de produccion).
#
# Arranque:
#   ./mvnw -pl infra/config-server spring-boot:run -Dspring-boot.run.profiles=git
#
# Ventaja frente al backend `native`: la configuracion queda versionada, con
# historial, revision por pares y posibilidad de volver atras. Es lo que se
# usa en produccion.
#
# Por defecto apunta a un repositorio dentro de este mismo proyecto para que
# funcione sin preparar nada. Cambia CONFIG_REPO_URI para apuntar al repositorio
# real (https://... o git@...).
#
# El proyecto anterior fijaba aqui file:///c:/config-repo, una ruta absoluta de
# Windows a una carpeta fuera del repositorio que habia que crear a mano con un
# script .bat. Si esa carpeta no existia, el servidor no arrancaba.
#
spring.cloud.config.server.git.uri=${CONFIG_REPO_URI:file:./infra/config-server/config-repo-git}
spring.cloud.config.server.git.default-label=main
spring.cloud.config.server.git.clone-on-start=true
spring.cloud.config.server.git.timeout=10
