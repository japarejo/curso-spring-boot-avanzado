server.port=8064
spring.application.name=roles-privilegios-service

spring.datasource.url=jdbc:h2:mem:roles;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.h2.console.enabled=true

springdoc.swagger-ui.path=/swagger-ui.html

# ---------------------------------------------------------------------------
# El interruptor del ejercicio 2 del guion.
#
#   true  -> al cargar el usuario se recorren TAMBIEN los roles que hereda por
#            la jerarquia y se le dan sus privilegios. ADMIN hereda de verdad
#            todo lo que puede hacer un VETERINARIO.
#   false -> comportamiento "ingenuo" (el del articulo de Baeldung tal cual):
#            solo se expanden los privilegios de los roles ASIGNADOS. La
#            jerarquia funciona para hasRole(...), pero NO para hasAuthority(...)
#            sobre privilegios.
# ---------------------------------------------------------------------------
demo.roles.heredar-privilegios=true

# Para ver en consola que autoridad se exige y cual se tiene en cada decision:
#logging.level.org.springframework.security.authorization=TRACE
