<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Petclinic Auth</title>
	<style>
		body {
			font-family: Arial, sans-serif;
			margin: 40px;
			max-width: 720px;
			color: #1f2937;
		}

		form {
			display: grid;
			gap: 12px;
			max-width: 360px;
			margin-bottom: 24px;
		}

		label {
			display: grid;
			gap: 6px;
			font-weight: 700;
		}

		input {
			padding: 9px 10px;
			border: 1px solid #cbd5e1;
			border-radius: 4px;
			font: inherit;
		}

		button,
		a.button {
			display: inline-block;
			width: fit-content;
			padding: 9px 12px;
			border: 0;
			border-radius: 4px;
			background: #2563eb;
			color: white;
			text-decoration: none;
			font: inherit;
			cursor: pointer;
		}

		.oauth2-actions {
			display: flex;
			flex-wrap: wrap;
			gap: 10px;
			margin-bottom: 16px;
		}

		.error {
			color: #b91c1c;
			font-weight: 700;
		}

		code {
			background: #f1f5f9;
			padding: 2px 4px;
			border-radius: 3px;
		}
	</style>
</head>
<body>
	<h1>Petclinic Auth</h1>
	<h2>Local user/password</h2>
	<p class="error" th:if="${hasError}">Invalid username or password.</p>
	<form method="post" th:action="@{/login}">
		<label>Username <input name="username" autocomplete="username" value="owner1" required></label>
		<label>Password <input name="password" type="password" autocomplete="current-password" value="0wn3r" required></label>
		<button type="submit">Sign in with form login</button>
	</form>
	<h2>OAuth2</h2>
	<div class="oauth2-actions">
		<a class="button" th:href="@{/oauth2/authorization/google}">Sign in with Google</a>
		<a class="button" th:href="@{/oauth2/authorization/github}">Sign in with GitHub</a>
		<a class="button" th:href="@{/oauth2/authorization/azure}">Sign in with Azure</a>
	</div>
	<p>Both flows return a JWT response with an <code>auth_provider</code> claim.</p>
</body>
</html>
