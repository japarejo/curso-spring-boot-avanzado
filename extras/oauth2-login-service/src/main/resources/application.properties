server.port=8062
spring.application.name=oauth2-login-service
api.version=v1

# Eureka service registry configuration:
eureka.client.serviceUrl.defaultZone=${EUREKA_URI:http://localhost:8761/eureka}
eureka.client.serviceUrl.instance.preferIpAddress=true
eureka.client.fetch-registry=false
eureka.client.register-with-eureka=false

# OpenApi Docs configuration:
springdoc.api-docs.path=/doc
springdoc.swagger-ui.path=/

# JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.hbm2ddl.import_files=base-data.sql,test-users.sql
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=true

# OAuth2 providers. Replace the defaults through environment variables before using real provider logins.
app.oauth2.success-redirect-uri=${OAUTH2_SUCCESS_REDIRECT_URI:http://localhost:8062/oauth2/success}
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:google-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:github-client-id}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:github-client-secret}
spring.security.oauth2.client.registration.github.scope=read:user,user:email

spring.security.oauth2.client.registration.azure.client-id=${AZURE_CLIENT_ID:azure-client-id}
spring.security.oauth2.client.registration.azure.client-secret=${AZURE_CLIENT_SECRET:azure-client-secret}
spring.security.oauth2.client.registration.azure.scope=openid,profile,email
spring.security.oauth2.client.registration.azure.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.azure.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.azure.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
app.oauth2.azure-tenant=${AZURE_TENANT_ID:common}
spring.security.oauth2.client.provider.azure.authorization-uri=https://login.microsoftonline.com/${app.oauth2.azure-tenant}/oauth2/v2.0/authorize
spring.security.oauth2.client.provider.azure.token-uri=https://login.microsoftonline.com/${app.oauth2.azure-tenant}/oauth2/v2.0/token
spring.security.oauth2.client.provider.azure.jwk-set-uri=https://login.microsoftonline.com/${app.oauth2.azure-tenant}/discovery/v2.0/keys
spring.security.oauth2.client.provider.azure.user-info-uri=https://graph.microsoft.com/oidc/userinfo
spring.security.oauth2.client.provider.azure.user-name-attribute=sub

# Same RSA key pair as security-rsa-microservice, so generated JWTs keep the same signature contract.
# =========================================================================
#  CLAVES DE DEMOSTRACION. Generadas para este curso y versionadas a
#  proposito para que el modulo funcione sin preparar nada.
#  NO USAR EN PRODUCCION: una clave privada real nunca se guarda en el
#  control de versiones (modulo 3, "secretos en el repositorio").
#
#  Se sobrescriben con variables de entorno:
#     JWT_PRIVATE_KEY / JWT_PUBLIC_KEY
# =========================================================================
jwt.private-key=${JWT_PRIVATE_KEY:}
jwt.public-key=${JWT_PUBLIC_KEY:}
