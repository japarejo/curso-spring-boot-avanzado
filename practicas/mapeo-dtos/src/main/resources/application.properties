spring.application.name=mapeo-dtos

# H2 en memoria. Hibernate crea el esquema y despues se carga data.sql.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=true

# Sin Open Session In View: la sesion de Hibernate se cierra al salir del
# servicio. Si el mapper toca una relacion LAZY que no se ha cargado, salta
# LazyInitializationException. Asi se ve que el repositorio debe traer lo que
# el DTO necesita (ver @EntityGraph en PropietarioRepository).
spring.jpa.open-in-view=false
