spring.application.name=mapeos-jpa

# H2 en memoria. Hibernate crea el esquema a partir de las entidades.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Vuelca el DDL que genera Hibernate a un fichero, para leerlo sin buscar en la
# consola. Se regenera en cada arranque (append=false).
spring.jpa.properties.jakarta.persistence.schema-generation.scripts.action=create
spring.jpa.properties.jakarta.persistence.schema-generation.scripts.create-target=target/ddl-generado.sql
spring.jpa.properties.hibernate.hbm2ddl.schema-generation.script.append=false
