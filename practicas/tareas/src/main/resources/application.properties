spring.application.name=tareas

# --- Persistencia (modulo 6) ---------------------------------------------------
# Sin spring.datasource.url, Spring Boot crea una H2 en memoria con nombre
# aleatorio. Se fija para poder entrar por la consola con una URL conocida.
spring.datasource.url=jdbc:h2:mem:tareas
spring.h2.console.enabled=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Hace que data.sql se ejecute DESPUES de que Hibernate cree las tablas.
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false

# --- Actuator (modulo 1, ejercicio 8) ------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics,loggers,beans,conditions,mappings
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.description=Aplicacion creada desde cero en el curso Spring Boot avanzado
